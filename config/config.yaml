job_boards:
  builtin:
    enabled: true
    url: https://builtin.com/jobs
  glassdoor:
    enabled: false
    url: ''
  indeed:
    enabled: true
    url: https://www.indeed.com/jobs
  linkedin:
    enabled: true
    url: https://www.linkedin.com/jobs/search
  remotive:
    enabled: true
    url: https://remotive.com/api/remote-jobs
  themuse:
    enabled: true
    url: https://www.themuse.com/api/public/jobs
  wellfound:
    enabled: true
    url: https://wellfound.com/jobs
logging:
  level: INFO
  log_file: ./logs/job_search.log
  max_size_mb: 10
output:
  dashboard_port: 5051
  keep_days: 30
  results_folder: ./data/results
  save_results_json: true
resume:
  filename: resume.docx
  folder: ../resumes
scheduler:
  enabled: true
  notify_on_new_jobs: true
  run_time: 08:00
  timezone: America/New_York
search:
  high_priority_industries:
  - Cloud Computing
  - Enterprise Tech
  - Cybersecurity
  - FinTech
  - AI Infrastructure
  job_types:
  - full-time
  - contract
  locations:
  - Boston, MA
  - New York, NY
  max_jobs_per_source: 40
  max_total_jobs: 400
  min_match_score: 40
  recent_days: 7
  remote_ok: true
  search_radius_miles: 50
